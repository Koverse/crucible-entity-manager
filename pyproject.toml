[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible-entity-manager"
version = "0.1.0"
description = "Entity correlation pipeline for the Crucible Executor platform"
readme = "README.md"
requires-python = ">=3.12"
# cruciblelib is not on PyPI. It is installed from the crucible-analytics release
# wheel (see README) and is pre-installed in the Executor profile image.
dependencies = [
    "aiohttp>=3.12",
    "cruciblelib>=1.8.4",
    "numpy>=2.3",
    "scipy>=1.16",
]

[project.optional-dependencies]
dev = [
    "filterpy>=1.4.5",  # parity-fixture generation only (DESIGN.md §9)
    "pytest>=9.0",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "ruff>=0.16",
    "ty>=0.0.84",
]

[tool.setuptools.packages.find]
where = ["src"]

# --- ruff ---------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
    "DTZ",    # flake8-datetimez: no naive datetimes
    "E",      # pycodestyle errors
    "EM",     # flake8-errmsg
    "ERA",    # eradicate: no commented-out code
    "F",      # pyflakes
    "FBT",    # flake8-boolean-trap
    "G",      # flake8-logging-format
    "I",      # isort
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "N",      # pep8-naming
    "PERF",   # perflint
    "PIE",    # flake8-pie
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # ruff-specific
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "T20",    # flake8-print
    "TC",     # flake8-type-checking
    "TID",    # flake8-tidy-imports
    "TRY",    # tryceratops
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "D105",    # magic-method docstrings add nothing
    "D107",    # __init__ is documented on the class
    "ISC001",  # conflicts with the formatter
    "TRY400",  # expected failures (rejected records) are logged without tracebacks
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pandas".msg = "pandas is not used in this project (DESIGN.md §4)."
"filterpy".msg = "filterpy is a dev-only parity reference; use crucible_entity_manager.core."
"stonesoup".msg = "StoneSoup is not used in this project; use crucible_entity_manager.core."

[tool.ruff.lint.per-file-ignores]
# Explicit Any is permitted only at the cruciblelib boundary (DESIGN.md §11).
"src/crucible_entity_manager/crucible/**" = ["ANN401"]
# The parity generator runs the baseline against filterpy (DESIGN.md §9).
"tests/parity/generate.py" = ["TID251"]
"tests/**" = [
    "D",        # test names are the documentation
    "EM",       # fakes raise errors with literal messages
    "TRY003",   # fakes raise errors with literal messages
    "PLR2004",  # literal expected values are the point of a test
    "S101",     # pytest uses assert
    "S105",     # fake tokens are not secrets
    "S608",     # expected SQL appears in assertions
    "SLF001",   # tests may inspect internals
]

# --- ty -----------------------------------------------------------------------

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
all = "error"

# --- pytest -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "live: runs against a live Crucible cluster; skipped unless CRUCIBLE_SERVICES_HOST is set",
]

# --- coverage -----------------------------------------------------------------

[tool.coverage.run]
branch = true
# The shutdown tests run the process in a subprocess that ends with os._exit.
patch = ["_exit", "subprocess"]
# The coverage gate applies to these packages (DESIGN.md §9).
source = [
    "crucible_entity_manager.cli",
    "crucible_entity_manager.components",
    "crucible_entity_manager.config",
    "crucible_entity_manager.core",
    "crucible_entity_manager.crucible",
    "crucible_entity_manager.hooks",
    "crucible_entity_manager.runtime",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
