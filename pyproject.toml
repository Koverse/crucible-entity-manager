[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible-entity-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
	"numpy",
	"pandas",
	"aiohttp",
	"aiohttp-sse-client",
	"scipy",
	"pyproj",
	"polars",
	"pyarrow",
	"stonesoup",
	"filterpy",
	"cruciblelib",
	"utm",
	"httpx[http2]",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
